name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/build-ios.yml']
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Get build tools and pinned sources
        run: |
          brew install xcodegen ninja
          curl -fL --retry 3 -o /tmp/llama.zip https://github.com/ggml-org/llama.cpp/archive/refs/tags/b5046.zip
          echo '628626865cdc521bcfcbd3f11dd1ca8a229e13899132847138814e88d060ebf6  /tmp/llama.zip' | shasum -a 256 -c -
          unzip -q /tmp/llama.zip -d /tmp
          mv /tmp/llama.cpp-b5046 ios/vendor
          mkdir -p ios/Resources
          curl -fL --retry 3 -o ios/Resources/smollm2-135m-q4_k_m.gguf 'https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf?download=true'
          echo '2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d  ios/Resources/smollm2-135m-q4_k_m.gguf' | shasum -a 256 -c -
          cp app/src/main/assets/*LICENSE* ios/Resources/
          cp app/src/main/assets/SmolLM2-APACHE-2.0.txt app/src/main/assets/MODEL-NOTICE.txt ios/Resources/
      - name: Build optimized CPU engine for iPhone
        run: |
          cmake -S ios/vendor -B ios/native -G Ninja -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_ACCELERATE=OFF -DGGML_BLAS=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF
          cmake --build ios/native --target llama --parallel 3
      - name: Build app and package IPA for local signing
        run: |
          cd ios
          xcodegen generate
          xcodebuild -project AIClusterBenchmark.xcodeproj -scheme AIClusterBenchmark -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > xcode-build.log 2>&1 || { tail -100 xcode-build.log; exit 1; }
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AIClusterBenchmark.app Payload/
          test -f Payload/AIClusterBenchmark.app/smollm2-135m-q4_k_m.gguf
          xcrun vtool -show-build Payload/AIClusterBenchmark.app/AIClusterBenchmark
          codesign --force --sign - Payload/AIClusterBenchmark.app
          codesign --verify --deep --strict Payload/AIClusterBenchmark.app
          zip -q -0 -r AIClusterBenchmark-ios-preview.ipa Payload
          shasum -a 256 AIClusterBenchmark-ios-preview.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-preview
          path: |
            ios/*.ipa
            ios/SHA256.txt
            ios/xcode-build.log
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-preview >/dev/null 2>&1 || gh release create ios-preview --prerelease --title 'iPhone preview — LLM benchmark' --notes 'Experimental iPhone app with bundled SmolLM2 model. Requires local signing and installation via Sideloadly on Windows; this IPA is not signed for direct installation. No Apple credentials are used by this workflow. Real-device launch is not yet verified. iOS 16+; CPU only; Wi-Fi cluster not included.'
          gh release upload ios-preview ios/AIClusterBenchmark-ios-preview.ipa ios/SHA256.txt --clobber

